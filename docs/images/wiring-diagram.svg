<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:3}.title{font:700 30px Arial;fill:#0f172a}
      .sub{font:18px Arial;fill:#475569}.label{font:700 19px Arial;fill:#0f172a}.pin{font:17px Arial;fill:#334155}
      .note{font:17px Arial;fill:#475569}.bus{stroke:#0891b2;stroke-width:5;fill:none}.sig{stroke:#7c3aed;stroke-width:4;fill:none}
      .pwr{stroke:#dc2626;stroke-width:4;fill:none}.gnd{stroke:#111827;stroke-width:4;fill:none}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1180"/>
  <text x="70" y="70" class="title">Fuellstandsmesser_classic V0.12.3 – Verdrahtung / Wiring diagram</text>
  <text x="70" y="108" class="sub">ESP8266 D1 mini · VL53L0X/VL53L1X · AHT10 optional · Nokia 5110 / PCD8544</text>
  <rect x="690" y="210" width="420" height="700" rx="28" class="box"/>
  <text x="900" y="265" text-anchor="middle" class="title">ESP8266 D1 mini</text>
  <text x="900" y="300" text-anchor="middle" class="sub">3.3 V Logik / logic</text>
  <g class="pin">
    <text x="720" y="385">3V3</text><circle cx="690" cy="378" r="8" fill="#dc2626"/>
    <text x="720" y="445">GND</text><circle cx="690" cy="438" r="8" fill="#111827"/>
    <text x="720" y="525">D1 / GPIO5 · I²C SCL</text><circle cx="690" cy="518" r="8" fill="#0891b2"/>
    <text x="720" y="585">D2 / GPIO4 · I²C SDA</text><circle cx="690" cy="578" r="8" fill="#0891b2"/>
  </g>
  <g class="pin" text-anchor="end">
    <text x="1080" y="405">D5 / GPIO14 · LCD CLK</text><circle cx="1110" cy="398" r="8" fill="#7c3aed"/>
    <text x="1080" y="465">D7 / GPIO13 · LCD DIN</text><circle cx="1110" cy="458" r="8" fill="#7c3aed"/>
    <text x="1080" y="525">D4 / GPIO2 · LCD DC</text><circle cx="1110" cy="518" r="8" fill="#7c3aed"/>
    <text x="1080" y="585">D6 / GPIO12 · LCD CS</text><circle cx="1110" cy="578" r="8" fill="#7c3aed"/>
    <text x="1080" y="645">D3 / GPIO0 · LCD RST</text><circle cx="1110" cy="638" r="8" fill="#7c3aed"/>
  </g>
  <rect x="80" y="225" width="430" height="310" rx="24" class="box"/>
  <text x="295" y="275" text-anchor="middle" class="title">ToF Sensor</text>
  <text x="295" y="310" text-anchor="middle" class="sub">VL53L0X oder / or VL53L1X · 0x29</text>
  <text x="115" y="375" class="label">VCC</text><text x="115" y="425" class="label">GND</text><text x="115" y="475" class="label">SCL</text><text x="115" y="525" class="label">SDA</text>
  <circle cx="510" cy="368" r="8" fill="#dc2626"/><circle cx="510" cy="418" r="8" fill="#111827"/><circle cx="510" cy="468" r="8" fill="#0891b2"/><circle cx="510" cy="518" r="8" fill="#0891b2"/>
  <rect x="80" y="650" width="430" height="270" rx="24" class="box"/>
  <text x="295" y="700" text-anchor="middle" class="title">AHT10 (optional)</text>
  <text x="295" y="735" text-anchor="middle" class="sub">Temperatur / Luftfeuchte · Temperature / humidity · 0x38</text>
  <text x="115" y="795" class="label">VCC</text><text x="115" y="840" class="label">GND</text><text x="115" y="885" class="label">SCL / SDA</text>
  <circle cx="510" cy="788" r="8" fill="#dc2626"/><circle cx="510" cy="833" r="8" fill="#111827"/><circle cx="510" cy="878" r="8" fill="#0891b2"/>
  <rect x="1280" y="265" width="440" height="520" rx="24" class="box"/>
  <text x="1500" y="315" text-anchor="middle" class="title">Nokia 5110 / PCD8544</text>
  <text x="1500" y="350" text-anchor="middle" class="sub">84×48 LCD · 3.3 V Logik / logic</text>
  <g class="label"><text x="1320" y="420">VCC</text><text x="1320" y="470">GND</text><text x="1320" y="535">CLK</text><text x="1320" y="595">DIN</text><text x="1320" y="655">DC</text><text x="1320" y="715">CS</text><text x="1320" y="775">RST</text></g>
  <g><circle cx="1280" cy="413" r="8" fill="#dc2626"/><circle cx="1280" cy="463" r="8" fill="#111827"/><circle cx="1280" cy="528" r="8" fill="#7c3aed"/><circle cx="1280" cy="588" r="8" fill="#7c3aed"/><circle cx="1280" cy="648" r="8" fill="#7c3aed"/><circle cx="1280" cy="708" r="8" fill="#7c3aed"/><circle cx="1280" cy="768" r="8" fill="#7c3aed"/></g>
  <path d="M510 468 H600 V518 H690" class="bus"/><path d="M510 518 H620 V578 H690" class="bus"/><path d="M510 878 H570 V518 H690" class="bus dash"/><path d="M510 878 H590 V578 H690" class="bus dash"/>
  <path d="M1110 398 H1200 V528 H1280" class="sig"/><path d="M1110 458 H1210 V588 H1280" class="sig"/><path d="M1110 518 H1220 V648 H1280" class="sig"/><path d="M1110 578 H1230 V708 H1280" class="sig"/><path d="M1110 638 H1240 V768 H1280" class="sig"/>
  <path d="M690 378 H610 V160 H560" class="pwr"/><path d="M560 160 V368 H510" class="pwr"/><path d="M560 160 V788 H510" class="pwr"/><path d="M610 160 H1200 V413 H1280" class="pwr"/><text x="780" y="150" class="label" fill="#dc2626">3.3 V Versorgung / supply</text>
  <path d="M690 438 H640 V980 H560" class="gnd"/><path d="M560 980 V418 H510" class="gnd"/><path d="M560 980 V833 H510" class="gnd"/><path d="M640 980 H1190 V463 H1280" class="gnd"/><text x="790" y="1010" class="label">GND gemeinsam / common GND</text>
  <rect x="70" y="1035" width="1660" height="100" rx="18" fill="#e2e8f0"/>
  <text x="95" y="1070" class="note">Hinweis / Note: Firmware-relevante Verdrahtung / firmware-relevant wiring. ToF XSHUT/INT nicht benötigt / not required.</text>
  <text x="95" y="1102" class="note">Nokia-5110-Backlight ist nicht festgelegt / not assigned. Versorgung passend zum Modul / power according to module specification.</text>
</svg>